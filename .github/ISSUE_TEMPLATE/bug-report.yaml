name: Bug Report
description: Report a bug, crash, or unexpected behaviour in SAPP-HTTP.
title: "[BUG] <title>"
labels: [ "bug", "needs triage" ]
assignees: Chalwk
body:
  - type: markdown
    attributes:
      value: |
        **Is this a security issue?**
        > If this bug could expose credentials, leak sensitive data, or let an
        > attacker do something they shouldn't, **do not open a public issue**.
        > Use the [Report a vulnerability](https://github.com/Chalwk/SAPP-HTTP/security/advisories/new)
        > link on the new issue page instead.
        >
        > For all other bugs, continue below.
  - type: markdown
    attributes:
      value: |
        **Describe the bug**
        > Provide a clear and concise description in the following sections.
        > Use headers (`#`) or lists (`-`) to organize your thoughts.
  - type: input
    id: dll-version
    attributes:
      label: DLL Version
      description: Provide the version or commit of SAPP-HTTP you're using.
      placeholder: "e.g., 1.0.0 or commit hash"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime are you loading the DLL into?
      placeholder: "e.g., SAPP 1.0, Phasor 2.x"
    validations:
      required: true
  - type: textarea
    id: lua-script
    attributes:
      label: Lua Script or Snippet
      description: Paste the minimal Lua code that triggers the problem. Redact any API keys or real URLs.
      placeholder: |
        local http = require("sapp_http")
        ...
      render: lua
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: "Explain the expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what actually happened, including any error output or crash details.
      placeholder: "Paste the full error output here"
      render: shell
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: Which version of Windows are you running?
      placeholder: "e.g., Windows 11 23H2, Windows Server 2019"
    validations:
      required: true
  - type: input
    id: bitness
    attributes:
      label: Bitness
      description: The DLL is built for 32-bit Windows. Confirm the bitness of your host process.
      placeholder: "e.g., 32-bit"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Write any other context or information about the bug here.
      placeholder: "Further context or information here"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **Screenshots and Logs**
        > Include any relevant screenshots or log files to help illustrate the bug.
        >
        > Please make sure you have redacted any API keys, tokens, or real IP addresses before posting.
        >
        >
        > Thank you
        >
        > **I appreciate your effort in reporting bugs in SAPP-HTTP. Your input is invaluable!**